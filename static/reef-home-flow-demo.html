<!doctype html>
<html lang="zh-CN" data-theme="night">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ReefPal · 今日轻量布局预览</title>
<style>
@font-face{font-family:Reef;src:url('/static/fonts/ReefPalDisplay.ttf');font-display:swap}
:root{color-scheme:dark;--bg:#0a1422;--ink:#edf4f2;--muted:#9caeb8;--line:#ffffff19;--accent:#9edbc9;--warm:#ffa48a;--panel:#142333;--wash:radial-gradient(ellipse at 100% 0%,#32436566,transparent 55%),linear-gradient(150deg,#111d30,#08131e)}
html[data-theme=day]{color-scheme:light;--bg:#edf4f0;--ink:#243b43;--muted:#61777a;--line:#234b4420;--accent:#286b60;--warm:#a54731;--panel:#fafcf8;--wash:radial-gradient(ellipse at 0% 0%,#fff4d8,transparent 55%),linear-gradient(155deg,#f7faf4,#e1eeeb)}
html[data-theme=dusk]{--bg:#222435;--ink:#fff1e4;--muted:#d0b9b7;--line:#ffe4cc24;--accent:#b8e1cb;--warm:#ffc18e;--panel:#302b3b;--wash:radial-gradient(ellipse at 90% 5%,#f7af6c88,transparent 35%),linear-gradient(175deg,#62526c 0%,#965e6288 28%,#182735 70%)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'HarmonyOS Sans SC','Microsoft YaHei',sans-serif}button,a,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid var(--warm);outline-offset:3px}button{color:inherit}main{max-width:560px;margin:auto;min-height:100dvh;background:var(--wash);padding:18px 20px 95px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}header strong{font:22px Reef,sans-serif}small,.muted{color:var(--muted)}.themes{display:flex;gap:2px}.themes button{border:0;background:transparent;padding:10px 9px;border-radius:20px;font-size:12px}.themes button[aria-pressed=true]{background:var(--line);color:var(--accent)}
.reef{overflow:hidden;border-radius:26px;background:#122932;color:#f8fcf8}.view{position:relative;height:254px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}.view img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center 58%;inset:0;z-index:-2}.view:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#03151b55,transparent 25%,#071b24f2);z-index:-1}.view-top{display:flex;justify-content:space-between;font-size:12px;color:#e0ebe5}.view h1{font:32px/1.2 Reef,sans-serif;margin:8px 0}.view p{font-size:13px;color:#ccdbd9;margin:0;max-width:29em}.live{display:inline-block;width:6px;height:6px;background:#a5e9cf;border-radius:50%;margin-right:7px;box-shadow:0 0 12px #9edbc9}.actions{display:flex;align-items:center;gap:12px;padding:14px 18px}.actions button{min-height:46px;border-radius:13px;padding:10px 18px;border:0;font-weight:700}.primary{background:#9edbc9;color:#133d3c}.actions .secondary{background:transparent;color:#dbebe6;border:1px solid #9edbc94a}.actions small{font-size:11px;color:#a7beb9;margin-left:auto}
section.plain{padding:23px 0 18px;border-bottom:1px solid var(--line)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}h2{font:20px Reef,sans-serif;margin:0}.text-btn{background:transparent;border:0;color:var(--accent);padding:8px 0;min-height:44px;font-size:13px}.signal{display:flex;gap:10px;align-items:center}.signal svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.6;flex:none}.signal strong{font-size:17px}.pulse p{margin:7px 0 0 38px;color:var(--muted);font-size:13px;line-height:1.65}.pulse-footer{margin:12px 0 0 38px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}.pulse-footer span{color:var(--warm)}
.readings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0}.reading{border:0;border-right:1px solid var(--line);background:transparent;text-align:left;padding:3px 7px 4px}.reading:first-child{padding-left:0}.reading:last-child{border:0}.reading span,.reading b,.reading small{display:block}.reading span{font-size:12px;color:var(--muted)}.reading b{font:22px/1.5 'Bahnschrift',sans-serif;font-variant-numeric:tabular-nums}.reading small{font-size:10px}.reading.low b{color:var(--warm)}.data-note{margin:14px 0 0;font-size:12px;color:var(--muted)}.recent{padding:20px 0}.event{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.event time{font-size:12px;color:var(--muted)}.event strong{font-size:14px;font-weight:500}.event span{font-size:12px;color:var(--accent)}.preview-note{font-size:11px;color:var(--muted);margin-top:14px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,560px);padding:10px 15px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line)}.nav button{border:0;background:transparent;min-height:44px;padding:9px 22px;color:var(--muted)}.nav .selected{color:var(--accent);border-bottom:2px solid var(--accent)}
dialog{width:min(94vw,500px);max-height:85dvh;overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:22px;padding:22px}dialog::backdrop{background:#030b16a8;backdrop-filter:blur(5px)}dialog h2{margin-bottom:14px}.dialog-head{display:flex;justify-content:space-between;align-items:start}.close{background:transparent;border:0;min-width:44px;min-height:44px;font-size:25px}dialog p{color:var(--muted);font-size:14px}.detail-chart{width:100%;height:140px;color:var(--accent)}.detail-chart polyline{fill:none;stroke:currentColor;stroke-width:3;stroke-linejoin:round}.detail-chart line{stroke:var(--line)}.detail-chart text{fill:var(--muted);font-size:11px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choices button{background:var(--line);border:1px solid var(--line);border-radius:12px;padding:12px}.choices button:hover{border-color:var(--accent)}.input-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.input-row input{min-width:0;width:140px;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px;border-radius:10px}.save{border:0;border-radius:12px;padding:12px 22px;margin-top:15px;background:var(--accent);color:var(--bg)}
@media(max-width:400px){main{padding:12px 15px 90px}.view{height:235px}.actions{padding:12px 15px;gap:8px}.actions button{padding:10px 15px}.actions small{display:none}.reading b{font-size:20px}.nav button{padding:9px 17px}}@media(min-width:800px){main{margin:20px auto;border-radius:28px}.nav{border-radius:20px 20px 0 0}}@media(prefers-reduced-motion:no-preference){.live{animation:breathe 4s ease-in-out infinite}@keyframes breathe{50%{opacity:.45;box-shadow:0 0 4px #9edbc9}}}
</style><link rel="stylesheet" href="/static/reef-home-light.css?v=6"></head>
<body><main><header><strong>ReefPal</strong><div class="themes" aria-label="预览主题"><button data-theme="day" aria-pressed="false">白天</button><button data-theme="dusk" aria-pressed="false">黄昏</button><button data-theme="night" aria-pressed="true">夜晚</button></div></header><p class="demo-caption">今日预览 · 示例数据</p>
<section class="reef"><div class="view"><img src="/static/demo-assets/forest-reef-portrait.jpg" alt="海水缸旧照"><div class="view-top"><span>我的鱼缸 · LPS · 46 L</span><span>旧照</span></div><div><span style="font-size:12px"><i class="live"></i>今日礁窗</span><h1 id="heroTitle">今天，还没看过一圈</h1><p id="heroCopy">最近一次观察：珊瑚舒展，鱼只正常摄食。</p></div></div><div class="actions"><button class="primary" onclick="patrol()" id="patrol">看一圈</button><button class="secondary" onclick="water()">记一笔水质</button><span class="reef-friend" id="reefFriend" aria-hidden="true"><svg width="0" height="0" style="position:absolute"><defs><clipPath id="home-d4-front" clipPathUnits="objectBoundingBox">
        <path d="M 0,.75 L .19,.75 C .22,.71 .25,.695 .285,.70 C .325,.704 .35,.729 .365,.758 C .383,.734 .412,.729 .446,.734 C .49,.737 .526,.768 .551,.811 C .568,.845 .566,.869 .58,.882 C .594,.844 .621,.811 .65,.794 C .689,.772 .724,.787 .758,.807 C .786,.823 .80,.838 .811,.847 C .816,.827 .814,.816 .824,.801 C .849,.762 .886,.733 .918,.732 L .95,.732 C .951,.699 .958,.671 .974,.644 C .985,.625 .992,.599 1,.582 L 1,1 L 0,1 Z"/>
      </clipPath></defs></svg><img class="friend-back" src="/static/brand/d4-anemone-front-layer.png" alt="" width="80" height="80"><img class="friend-fish" src="/static/brand/d4-fish-layer.png" alt="" width="80" height="80"><img class="friend-front" src="/static/brand/d4-anemone-front-layer.png" alt="" width="80" height="80"></span></div></section>
<section class="plain pulse"><div class="section-head"><h2>礁况脉搏</h2><small>最近三次 · 截至昨天</small></div><div class="pulse-summary"><div class="pulse-verdict"><strong><em>KH</em> 缓慢回落</strong><span class="pulse-values" id="pulseChange"></span><small>仍在本缸参考范围内</small></div><div class="pulse-trace" id="pulseTrace"></div></div><div class="pulse-evidence"><span>本缸参考 7.5–10 dKH</span><button class="text-btn" onclick="analysis('KH')">查看依据 ↗</button></div></section>
<section class="plain"><div class="section-head"><h2>最近水质</h2><small>昨天测量</small></div><div class="readings"><button class="reading" onclick="analysis('KH')"><span>KH</span><b>7.7</b><small>dKH · <i class="trend trend-down" aria-label="下降">↘</i></small></button><button class="reading" onclick="analysis('钙')"><span>钙</span><b>425</b><small>ppm · <i class="trend trend-steady" aria-label="基本持平">→</i></small></button><button class="reading" onclick="analysis('镁')"><span>镁</span><b>1320</b><small>ppm · <i class="trend trend-steady" aria-label="基本持平">→</i></small></button><button class="reading" onclick="analysis('NO₃')"><span>NO₃</span><b>8.0</b><small>ppm · <i class="trend trend-steady" aria-label="基本持平">→</i></small></button><button class="reading" onclick="analysis('PO₄')"><span>PO₄</span><b>0.06</b><small>ppm · <i class="trend trend-steady" aria-label="基本持平">→</i></small></button></div><p class="data-note">点读数查看趋势与本缸参考范围</p></section>
<section class="recent"><div class="section-head"><h2>最近发生</h2><button class="text-btn" onclick="showHistory()">全部记录 →</button></div><div class="event"><time>昨天</time><strong>测了 5 项水质</strong><span>KH ↘</span></div><div class="event"><time>前天</time><strong>换水 9.2 L</strong><span>20%</span></div><p class="preview-note">布局预览 · 示例数据 · 操作仅在本页演示，不写入鱼缸记录</p></section>
</main><nav class="nav" aria-label="导航预览"><button class="selected" onclick="window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})">今日</button><button onclick="showHistory()">记录</button><button onclick="preview('工具','配盐、补充和滴定从这里进入。此稿先验证今日的信息层级。')">工具</button><button onclick="preview('我的','鱼缸档案、维护节奏和备份统一放在这里。')">我的</button></nav>
<dialog id="sheet" aria-labelledby="sheetTitle"><div class="dialog-head"><h2 id="sheetTitle"></h2><button class="close" aria-label="关闭" onclick="sheet.close()">×</button></div><div id="sheetBody"></div></dialog>
<script>
const sheet=document.getElementById('sheet');
document.querySelectorAll('[data-theme]').forEach(button=>{if(button.tagName==='BUTTON')button.onclick=()=>{document.documentElement.dataset.theme=button.dataset.theme;document.querySelectorAll('.themes button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}});
function openSheet(title,html){document.getElementById('sheetTitle').textContent=title;document.getElementById('sheetBody').innerHTML=html;if(!sheet.open)sheet.showModal()}
function preview(title,copy){openSheet(title,'<p>'+copy+'</p>')}
function patrol(){openSheet('看一圈','<p>今天缸里怎么样？</p><div class="choices"><button onclick="observed(0)">状态不错</button><button onclick="observed(1)">有些变化</button><button onclick="observed(2)">有一处要留意</button></div>')}
function observed(i){document.getElementById('heroTitle').textContent=['今天，缸里看着不错','今天，缸里有些变化','今天，有一处要留意'][i];document.getElementById('heroCopy').textContent='刚刚记下的观察 · 仅本页演示';document.getElementById('patrol').textContent='再看一次';sheet.close();const friend=document.getElementById('reefFriend');friend.classList.remove('ack');requestAnimationFrame(()=>friend.classList.add('ack'));clearTimeout(friendTimer);friendTimer=setTimeout(()=>friend.classList.remove('ack'),1600)}
let friendTimer;
function water(){openSheet('记一笔水质','<p>填写实测读数。这里演示录入面板。</p><form onsubmit="event.preventDefault();preview(\'已完成演示\',\'正式版保存后，会更新最近水质、脉搏判断和记录时间线。本页没有写入数据。\')">'+['KH','钙','镁','NO₃','PO₄'].map(s=>'<label class="input-row">'+s+'<input type="number" step="any" min="0" inputmode="decimal" placeholder="未测"></label>').join('')+'<button class="save">完成演示</button></form>')}
// One sample dataset drives the overview and detail charts. No API writes.
const readings={'KH':[8.1,7.9,7.7,'dKH',[7.5,10]],'钙':[426,425,425,'ppm',[400,450]],'镁':[1325,1320,1320,'ppm',[1250,1400]],'NO₃':[8.2,8.1,8,'ppm',[2,15]],'PO₄':[.06,.06,.06,'ppm',[.03,.12]]};
// A fixed aspect ratio and visible values keep this local trend legible.
const khValues=readings.KH.slice(0,3),khFloor=readings.KH[4][0];
const khCeiling=Math.max(...khValues)+.2;
const khPoints=khValues.map((value,i)=>[18+i*62,64-(value-khFloor)/(khCeiling-khFloor)*48]);
document.getElementById('pulseChange').innerHTML=(khValues[2]-khValues[0]).toFixed(1)+' <small>dKH · 近 5 天</small>';
document.getElementById('pulseTrace').innerHTML='<svg viewBox="0 0 160 96" role="img" aria-label="KH 最近三次示例读数：'+khValues.join('、')+' dKH；虚线为参考下限 '+khFloor+'"><line class="reference" x1="8" y1="64" x2="152" y2="64"/><text class="floor-label" x="152" y="76" text-anchor="end">'+khFloor+' 参考下限</text><path class="trend-area" d="M'+khPoints.map(p=>p.join(',')).join(' L')+' L142,64 L18,64 Z"/><path d="M'+khPoints.map(p=>p.join(',')).join(' L')+'"/>'+khPoints.map((p,i)=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3"/><text x="'+p[0]+'" y="'+(p[1]-9)+'" text-anchor="middle">'+khValues[i]+'</text><text class="date-label" x="'+p[0]+'" y="93" text-anchor="middle">'+['5天前','3天前','昨天'][i]+'</text>').join('')+'</svg>';
function chart(el,compact=false){
 const data=readings[el],values=data.slice(0,3),range=data[4];
 const lo=Math.min(...values,range[0]),hi=Math.max(...values,range[1]);
 const width=compact?132:380,height=compact?62:140,left=compact?6:30,right=width-left,top=compact?8:20,bottom=compact?54:104;
 const y=value=>bottom-(value-lo)/(hi-lo)*(bottom-top);
 const points=values.map((value,i)=>[left+(right-left)*i/2,y(value)]);
 return '<svg '+(compact?'':'class="detail-chart" ')+'viewBox="0 0 '+width+' '+height+'" role="img" aria-label="'+el+' 三次示例读数 '+values.join('、')+' '+data[3]+'，纵轴包含本缸参考范围"><line class="grid" x1="'+left+'" y1="'+bottom+'" x2="'+right+'" y2="'+bottom+'"/><polyline points="'+points.map(p=>p.join(',')).join(' ')+'"/>'+points.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3" fill="currentColor"/>').join('')+(compact?'':points.map((p,i)=>'<text text-anchor="'+(['start','middle','end'][i])+'" x="'+p[0]+'" y="132">'+['5天前','3天前','昨天'][i]+' '+values[i]+'</text>').join(''))+'</svg>';
}

function analysis(el){const data=readings[el];openSheet(el+' · 趋势与依据','<p>三次实测 · 示例数据</p>'+chart(el)+'<p>本缸参考：'+data[4].join('–')+' '+data[3]+'</p><p>'+(el==='KH'?'这三次读数逐步下降，目前仍在本缸参考范围内。前天有一次换水记录，但这些数据不能单独证明换水导致下降。':'最近三次读数变化较小。判断仍需结合测试误差、测量间隔和生物表现。')+'</p><button class="save" onclick="water()">记录新读数</button>')}
function showHistory(){openSheet('最近记录','<p>昨天 · 测了 5 项水质</p><p>前天 · 换水 9.2 L，约 20%</p><p>3 天前 · 观察：状态不错</p><p>正式版从这里进入完整记录页，回看时间线与变化链。</p>')}
sheet.addEventListener('click',e=>{if(e.target===sheet){const r=sheet.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)sheet.close()}});
</script></body></html>
